<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoCoder</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("cocoder.theme") || "system";
          var dark =
            pref === "dark" ||
            (pref !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (!m) { m = document.createElement("meta"); m.name = "theme-color"; document.head.appendChild(m); }
          m.content = dark ? "#1a1c2e" : "#f8f8fc";
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="CoCoder — Autonomous AI Coding Agent Dashboard for GitHub issues and automated pull requests."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
